[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "deepmem0"
version = "0.15.0"
description = "DeepMem0: memory for AI agents with first-class Portuguese and human-like memory dynamics (ACT-R). Fork of mem0 v2.0.7."
authors = [
    { name = "Alpha Quant AI" }
]
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10,<4.0"
dependencies = [
    "qdrant-client>=1.12.0",
    "pydantic>=2.7.3",
    "openai>=1.90.0",
    "httpx>=0.28.0",
    "posthog>=7.14.0",
    "pytz>=2024.1",
    "sqlalchemy>=2.0.31",
    "protobuf>=5.29.6,<7.0.0",
]

[project.urls]
Homepage = "https://github.com/fabiolenine/deepmem0"
Repository = "https://github.com/fabiolenine/deepmem0"

[project.scripts]
# A superfície própria do engine. Até aqui a camada-base só era alcançável por
# outro programa (o servidor MCP) — sem isto, "biblioteca que roda sozinha" era
# afirmação sem verificação possível.
deepmem0 = "mem0.cli:main"

[project.optional-dependencies]
nlp = [
    "spacy>=3.7.0",
]
# Language models for entity extraction and lemmatisation.
#
# spaCy models are NOT on PyPI, so they cannot be plain requirements — they are
# declared as PEP 508 direct references. Leaving them undeclared is what let a
# Portuguese deployment run on the English pipeline: the model was installed by
# hand on one machine and nothing recorded that the behaviour depended on it.
# `entity_pipeline_status()` reports whether the configured language's model is
# present, and a non-default language without its model fails readiness.
#
#   pip install "deepmem0[nlp-en]"      # English pipeline
#   pip install "deepmem0[nlp-pt]"      # Portuguese pipeline
nlp-en = [
    "spacy>=3.7.0",
    "en_core_web_sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
]
nlp-pt = [
    "spacy>=3.7.0",
    "pt_core_news_sm @ https://github.com/explosion/spacy-models/releases/download/pt_core_news_sm-3.8.0/pt_core_news_sm-3.8.0-py3-none-any.whl",
]
vector-stores = [
    "vecs>=0.4.0",
    "chromadb>=0.4.24",
    "cassandra-driver>=3.29.0",
    "weaviate-client>=4.15.4,<5.0.0",
    "pinecone<=7.3.0",
    "pinecone-text>=0.10.0",
    "faiss-cpu>=1.7.4",
    "upstash-vector>=0.6.0",
    "azure-search-documents>=11.4.0b8",
    "psycopg>=3.2.8",
    "psycopg-pool>=3.2.6,<4.0.0",
    "pymongo>=4.13.2",
    "pymochow>=2.2.9",
    "pymysql>=1.1.0",
    "dbutils>=3.0.3",
    "valkey>=6.0.0",
    "databricks-sdk>=0.63.0",
    "azure-identity>=1.24.0",
    "redis>=5.0.0,<6.0.0",
    "redisvl>=0.1.0,<1.0.0",
    "elasticsearch>=8.0.0,<9.0.0",
    "pymilvus>=2.4.0,<2.6.0",
    "langchain-aws>=0.2.23,<0.3.0",
]
llms = [
    "groq>=0.3.0",
    "together>=0.2.10",
    "litellm>=1.83.7",
    "openai>=1.90.0",
    "ollama>=0.3.0",
    "vertexai>=0.1.0",
    "google-generativeai>=0.3.0",
    "google-genai>=1.0.0",
]
extras = [
    "boto3>=1.34.0",
    "langchain>=0.3.30,<1.0.0",
    "langchain-community>=0.3.27,<1.0.0",
    "langchain-core>=0.3.85,<1.0.0",
    "sentence-transformers>=5.0.0",
    "elasticsearch>=8.0.0,<9.0.0",
    "opensearch-py>=2.0.0",
    "fastembed>=0.3.1",
]
test = [
    "pytest>=8.2.2",
    "pytest-mock>=3.14.0",
    "pytest-asyncio>=0.23.7",
]
dev = [
    "ruff>=0.6.5",
    "isort>=5.13.2",
    "pytest>=8.2.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "live_model: loads a real model from the HF cache (slow, environment-dependent). Deselected by default; run with -m live_model.",
]
addopts = "-m 'not live_model'"

[tool.hatch.metadata]
# Os extras `nlp-en`/`nlp-pt` apontam para as wheels dos modelos spaCy por URL —
# eles NÃO estão no PyPI, então não há como declará-los de outra forma. Sem esta
# autorização o hatch recusa a referência direta e o pacote simplesmente NÃO
# constrói: `python -m build --wheel` falha com
# "Dependency #2 of option `nlp-en` ... cannot be a direct reference".
#
# Isso passou despercebido porque a instalação de produção é EDITÁVEL (um .pth
# apontando para a árvore) e nunca precisou empacotar. Instalação editável
# mascara o que só aparece na hora de distribuir.
allow-direct-references = true

[tool.hatch.build]
include = [
    "mem0/**/*.py",
]
exclude = [
    "**/*",
    "!mem0/**/*.py",
]

[tool.hatch.build.targets.wheel]
packages = ["mem0"]
only-include = ["mem0"]

[tool.hatch.envs.dev_py_3_10]
python = "3.10"
features = [
  "test",
  "vector-stores",
  "llms",
  "extras",
]

[tool.hatch.envs.dev_py_3_11]
python = "3.11"
features = [
  "test",
  "vector-stores",
  "llms",
  "extras",
]

[tool.hatch.envs.dev_py_3_12]
python = "3.12"
features = [
  "test",
  "vector-stores",
  "llms",
  "extras",
]

[tool.hatch.envs.default.scripts]
format = [
    "ruff format",
]
format-check = [
    "ruff format --check",
]
lint = [
    "ruff check",
]
lint-fix = [
    "ruff check --fix",
]
test = [
    "pytest tests/ {args}",
]

[tool.ruff]
line-length = 120
exclude = ["openmemory/"]

[tool.ruff.lint.isort]
known-first-party = ["mem0", "mem0_cli"]

[tool.isort]
profile = "black"
known_first_party = ["mem0", "mem0_cli"]
# isort scope kept aligned with [tool.ruff.lint.isort] above.
# black-equivalent profile here matches the formatter behaviour ruff applies.
# Plugin-version bumps need a touch here to fire required CI checks (path-filter trap).
# Last touched: plugin v0.1.3
